# Citus Distributed PostgreSQL Cluster Umbrella Chart Values
# Designed for OpenShift Container Platform

global:
  # Target namespace on OpenShift
  namespace: postgresql-dev

  postgresql:
    username: postgres
    password: "ChangeMeSecurePassword123!"
    database: postgres
    port: 5432
    existingSecret: ""
    secretKeys:
      passwordKey: "postgres-password"

  image:
    repository: citusdata/citus
    tag: "12.1"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: citus-sa

  # OpenShift Security Context Constraints (SCC) Settings:
  # When bound to OpenShift 'anyuid' SCC:
  #   oc adm policy add-scc-to-user anyuid -z citus-sa -n postgresql-dev
  # standard PostgreSQL UID (999) can be used:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsUser: 999
    runAsGroup: 999

  podSecurityContext:
    fsGroup: 999

  openshift:
    enabled: true
    # Specify OpenShift storageClass or leave empty for cluster default
    storageClass: ""

# Subchart: Coordinator Service Chart
citus-coordinator:
  enabled: true
  replicaCount: 1

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Subchart: Worker Service Chart
citus-worker:
  enabled: true
  # 3 Worker nodes / shards as specified in requirements
  replicaCount: 3

  registration:
    enabled: true
    maxRetries: 30
    retryInterval: 5

  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
